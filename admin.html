<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Star - Complete Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #333;
            text-align: center;
        }
        .section {
            margin-top: 30px;
            padding: 20px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #111;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #111;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .total-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Seven Star - Admin Dashboard</h2>

        <!-- Product Upload & Management Section -->
        <div class="section">
            <h3>Add New Product / New Arrival</h3>
            <form id="productForm">
                <div class="form-group">
                    <label for="prodName">Product Name:</label>
                    <input type="text" id="prodName" placeholder="Enter product name" required>
                </div>
                <div class="form-group">
                    <label for="prodPrice">Price (PKR):</label>
                    <input type="number" id="prodPrice" placeholder="Enter price" required>
                </div>
                <div class="form-group">
                    <label for="prodImage">Image URL or Path:</label>
                    <input type="text" id="prodImage" placeholder="e.g., images/dress1.jpg" required>
                </div>
                <div class="form-group">
                    <label for="prodCategory">Category / Section:</label>
                    <select id="prodCategory">
                        <option value="New Arrivals">New Arrivals</option>
                        <option value="Luxury Dresses">Luxury Dresses</option>
                        <option value="Featured">Featured</option>
                    </select>
                </div>
                <button type="submit">Add Product to Store</button>
            </form>
        </div>

        <!-- Orders Section -->
        <div class="section">
            <h3>Customer Orders List</h3>
            <div class="total-box" id="totalOrders">Total Orders: 0</div>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Phone</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Payment</th>
                        <th>Region</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <!-- Orders dynamically yahan show hon ge -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Orders fetch karne ka function
        async function fetchOrders() {
            try {
                const response = await fetch('http://localhost:3000/api/admin/orders');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalOrders').innerText = "Total Orders: " + data.totalOrders;
                    const tbody = document.getElementById('ordersTableBody');
                    tbody.innerHTML = "";

                    if(data.orders.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #888;">No orders received yet.</td></tr>`;
                        return;
                    }

                    data.orders.forEach(order => {
                        const row = `<tr>
                            <td>${order.id}</td>
                            <td>${order.customerName}</td>
                            <td>${order.phone}</td>
                            <td>${order.product}</td>
                            <td>${order.price}</td>
                            <td>${order.paymentMethod}</td>
                            <td>${order.region}</td>
                            <td>${order.date}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                }
            } catch (error) {
                console.error("Error fetching orders:", error);
            }
        }

        // Nayi product add karne ki form submission
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const image = document.getElementById('prodImage').value;
            const category = document.getElementById('prodCategory').value;

            // Filhal local alert ya confirm ke taur par (Aage isko backend se link kar den ge)
            alert(`Success! Product "${name}" added to ${category} with price Rs. ${price}.`);
            document.getElementById('productForm').reset();
        });

        // Page khulte hi orders load hon ge aur har 5 second baad auto refresh hon ge
        fetchOrders();
        setInterval(fetchOrders, 5000);
    </script>

</body>
</html>
